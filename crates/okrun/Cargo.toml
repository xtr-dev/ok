[package]
name = "okrun"
description = "ok: a portable scripting language and task runner in one static binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["scripting", "task-runner", "make", "build", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[lib]
name = "okrun"
path = "src/lib.rs"

[[bin]]
name = "ok"
path = "src/main.rs"

[dependencies]
csv = "1.4.0"
flate2 = "1.1.11"
globset = "0.4.22"
hex = "0.4.3"
jiff = "1.0.3"
md-5 = "0.11.0"
regex = "1.13.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
toml = { version = "1.2.2", features = ["preserve_order"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip", "json"] }
yaml-rust2 = "0.13.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
