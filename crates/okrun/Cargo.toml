[package]
name = "okrun"
description = "ok: a portable scripting language and task runner in one static binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["scripting", "task-runner", "make", "build", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[lib]
name = "okrun"
path = "src/lib.rs"

[[bin]]
name = "ok"
path = "src/main.rs"

[dependencies]
csv = "1.4.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = { version = "1.2.2", features = ["preserve_order"] }
yaml-rust2 = "0.13.2"

[lints]
workspace = true
