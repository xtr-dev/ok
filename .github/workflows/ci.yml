name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast

  # The WebAssembly build is what the playground on the website runs.
  wasm:
    name: wasm (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo clippy -p okrun --target wasm32-wasip1 --locked -- -D warnings
      - run: cargo build -p okrun --release --target wasm32-wasip1 --locked
      - run: node --no-warnings tests/wasm/smoke.mjs target/wasm32-wasip1/release/ok.wasm

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  third-party:
    name: THIRD_PARTY.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate -m crates/okrun/Cargo.toml about.hbs > THIRD_PARTY.md
      - run: git diff --exit-code THIRD_PARTY.md

  fuzz:
    name: fuzz lexer and parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # rust-toolchain.toml pins stable, so nightly is selected explicitly.
      # The prebuilt cargo-fuzz defaults to its own musl target, where the
      # address sanitizer cannot work, so the glibc target is named.
      - run: cargo +nightly fuzz run lex --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: cargo +nightly fuzz run parse --target x86_64-unknown-linux-gnu -- -max_total_time=60
