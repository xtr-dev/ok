# Publishes site/ (the landing page, the playground and the install scripts)
# and the guide in docs/ (built by crates/okdocs) to GitHub Pages at https://okrun.dev/. The install scripts are first run on
# Linux, macOS and Windows against the latest release, so a broken script is
# never published. The playground's ok.wasm and the examples it shows come
# from the latest release, so the page runs the same ok the install scripts
# install; publishing a release redeploys the site.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "crates/okdocs/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The github-pages environment only accepts deployments from main, and a
  # release event runs on its tag. So a published release starts this
  # workflow again on main (which builds from the latest release anyway)
  # instead of deploying from the tag.
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  install:
    if: github.event_name != 'release'
    name: install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          OK_INSTALL_DIR="$RUNNER_TEMP/okbin" sh site/install.sh
          "$RUNNER_TEMP/okbin/ok" -e 'print(os.name, os.arch)'
      # Piping the file into iex is what `irm .../install.ps1 | iex` does.
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:OK_INSTALL_DIR = "$env:RUNNER_TEMP\okbin"
          Get-Content site/install.ps1 -Raw | Invoke-Expression
          & "$env:RUNNER_TEMP\okbin\ok.exe" -e 'print(os.name, os.arch)'
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # The site is uploaded in its own job and deployed in the next one. When
  # both happen in one job, deploy-pages often looks the artifact up before
  # it is listed ("No artifacts named github-pages") and the deploy fails.
  upload:
    name: upload site
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read        # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.latest.outputs.tag }}
          path: release
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            release
            .
      # Built inside release/ so its .cargo/config.toml (the stack size) applies.
      - run: cargo build -p okrun --release --target wasm32-wasip1 --locked
        working-directory: release
      # The site as published: site/ from this commit with the badge naming
      # the latest release, the playground's ok.wasm, and the example folders
      # playground.js loads.
      - env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          mkdir -p _site/examples
          cp -r site/. _site/
          sed -i -E "s/>v[0-9][0-9.]* is out</>$TAG is out</" _site/index.html
          grep -q ">$TAG is out<" _site/index.html
          cp release/target/wasm32-wasip1/release/ok.wasm _site/
          cp -r release/examples/log-summary release/examples/csv-to-json release/examples/config-render _site/examples/
      # The guide at /docs/, built from the release when it has one (so the
      # pages describe the ok the Run buttons use) and from this commit until
      # a release includes docs/.
      - run: |
          src=release
          [ -d release/docs ] || src=.
          echo "guide from: $src"
          (cd "$src" && cargo run -p okdocs --locked -- build docs "$GITHUB_WORKSPACE/_site")
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # deploy-pages reads the uploaded site artifact
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
