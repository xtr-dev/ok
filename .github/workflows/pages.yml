# Publishes site/ (the landing page, the playground and the install scripts)
# to GitHub Pages at https://okrun.dev/. The install scripts are first run on
# Linux, macOS and Windows against the latest release, so a broken script is
# never published. The playground's ok.wasm is built from this commit, and
# the examples it shows are copied from examples/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # the playground runs ok.wasm built from the crate and shows examples
      - "crates/okrun/**"
      - "Cargo.lock"
      - ".cargo/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  install:
    name: install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          OK_INSTALL_DIR="$RUNNER_TEMP/okbin" sh site/install.sh
          "$RUNNER_TEMP/okbin/ok" -e 'print(os.name, os.arch)'
      # Piping the file into iex is what `irm .../install.ps1 | iex` does.
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:OK_INSTALL_DIR = "$env:RUNNER_TEMP\okbin"
          Get-Content site/install.ps1 -Raw | Invoke-Expression
          & "$env:RUNNER_TEMP\okbin\ok.exe" -e 'print(os.name, os.arch)'
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # The site is uploaded in its own job and deployed in the next one. When
  # both happen in one job, deploy-pages often looks the artifact up before
  # it is listed ("No artifacts named github-pages") and the deploy fails.
  upload:
    name: upload site
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read        # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p okrun --release --target wasm32-wasip1 --locked
      # The site as published: site/, the playground's ok.wasm, and the
      # example folders playground.js loads.
      - run: |
          mkdir -p _site/examples
          cp -r site/. _site/
          cp target/wasm32-wasip1/release/ok.wasm _site/
          cp -r examples/log-summary examples/csv-to-json examples/config-render _site/examples/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # deploy-pages reads the uploaded site artifact
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
