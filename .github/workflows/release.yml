# Builds static release binaries for the six supported targets when a tag
# like v0.1.0 is pushed, and attaches them to a *draft* GitHub release.
# Publishing the release is done by hand by the project owner.
name: Release

# Runs only when started by hand. Started on a tag ref (`gh workflow run
# release.yml --ref v0.1.0`) it creates the draft release; started on a
# branch it only builds and checks, and the binaries are kept as workflow
# artifacts.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  tool: cross }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  tool: cross }
          - { target: x86_64-apple-darwin,        os: macos-latest,   tool: cargo }
          - { target: aarch64-apple-darwin,       os: macos-latest,   tool: cargo }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest, tool: cargo }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest, tool: cargo }
    runs-on: ${{ matrix.os }}
    env:
      # Windows: link the C runtime statically so the .exe has no VC++ redistributable dependency.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
      - if: matrix.tool == 'cross'
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cross
      - name: Build
        shell: bash
        run: ${{ matrix.tool }} build --release --locked --target ${{ matrix.target }} -p okrun --bin ok
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/ok${ext}" "dist/ok-${{ matrix.target }}${ext}"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.target }}
          path: dist/*

  # Runs every built binary on a machine of its own OS and architecture:
  # tests/smoke/smoke.ok (commands, quoting, paths, files, archives, TLS),
  # then `ok self init --wrappers` and the bootstrap wrappers, served from a
  # local HTTP server instead of the GitHub release.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin,        os: macos-15-intel }
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
          - { target: aarch64-pc-windows-msvc,    os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      EXT: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum ok-* > SHA256SUMS; else shasum -a 256 ok-* > SHA256SUMS; fi
          cat SHA256SUMS
      - name: Smoke script
        run: |
          chmod +x "dist/ok-$TARGET$EXT"
          "dist/ok-$TARGET$EXT" --version
          "dist/ok-$TARGET$EXT" tests/smoke/smoke.ok --net
      - name: ok self init --wrappers and running the wrappers
        env:
          OK_DOWNLOAD_URL: http://127.0.0.1:8765
          OK_TRUST: "1"
          MSYS_NO_PATHCONV: "1"
        run: |
          py=$(command -v python3 || command -v python)
          (cd dist && "$py" -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 3
          mkdir proj && cd proj
          "../dist/ok-$TARGET$EXT" self init --wrappers --checksums ../dist/SHA256SUMS
          test -f .ok/ok.ok
          case "$TARGET" in
            *windows*)
              cmd /c "ok.cmd hello cmd" | tee out-cmd
              grep -q "hello, cmd!" out-cmd
              powershell -NoProfile -ExecutionPolicy Bypass -File ok.ps1 hello ps | tee out-ps
              grep -q "hello, ps!" out-ps
              ;;
            *)
              ./ok hello sh | tee out-sh
              grep -q "hello, sh!" out-sh
              ;;
          esac

  release:
    name: draft release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-about
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Notices, licence and checksums
        run: |
          cargo about generate -m crates/okrun/Cargo.toml about.hbs > dist/THIRD_PARTY.md
          cp LICENSE-MIT LICENSE-APACHE dist/
          cd dist
          # Every binary must stay under the 15 MB budget from the definition of done.
          for f in ok-*; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            test "$size" -lt 15728640
          done
          sha256sum ok-* > SHA256SUMS
          cat SHA256SUMS
      # Signed build provenance for every binary: `gh attestation verify
      # ok-x86_64-unknown-linux-musl --repo xtr-dev/ok` shows that the file was
      # built by this workflow from this repository at the release tag.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ok-*
      # The notes are the version's CHANGELOG.md section, copied verbatim;
      # GitHub shows every newline in them as a line break, so the
      # CHANGELOG is not hard-wrapped.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')  # run by hand on a tag ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --draft --title "ok ${GITHUB_REF_NAME}" --notes-file <(sed -n "/^## \[${GITHUB_REF_NAME#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d')
