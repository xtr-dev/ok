# Fuzz targets: lexer, parser, formatter and checker, evaluation, data formats, archives. Not part of the workspace (cargo-fuzz
# needs a nightly toolchain); run with `cargo +nightly fuzz run parse`.
[package]
name = "okrun-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
okrun = { path = "../crates/okrun" }

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "fmt"
path = "fuzz_targets/fmt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data"
path = "fuzz_targets/data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eval"
path = "fuzz_targets/eval.rs"
test = false
doc = false
bench = false
