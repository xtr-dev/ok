# The WebAssembly build runs the interpreter on the main thread (WASI has no
# threads), so give that thread a larger stack than the 1 MiB default. Beyond 8 MiB the browser engine's own stack
# limit is reached first, so a bigger value only costs memory. The
# native builds start their own 256 MiB thread instead (crates/okrun/src/main.rs).
[target.wasm32-wasip1]
rustflags = ["-C", "link-arg=-zstack-size=8388608"]
