# cargo-deny configuration. Run with `cargo deny check`.
# Policy: permissive licences only. Copyleft licences (GPL, LGPL, AGPL, MPL,
# EPL, CDDL, ...) are rejected because ok is CC0 and ships as one static binary.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  # Permissive data licence of the Mozilla CA root list (webpki-root-certs,
  # used by rustls-platform-verifier). Not copyleft.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
